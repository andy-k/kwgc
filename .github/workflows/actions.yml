name: C
'on':
  push:
  pull_request:
jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          vendor: gcc
        - os: ubuntu-latest
          vendor: clang
        - os: macos-latest
          vendor: clang
        - os: macos-latest
          vendor: gcc
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@v7
    - name: Pick the compiler
      env:
        VENDOR: "${{ matrix.vendor }}"
      run: |
        set -euo pipefail
        cc=$VENDOR
        if [ "$VENDOR" = gcc ] && [ "$(uname)" = Darwin ]; then
          # `gcc` on a mac is a clang shim, so the real one has to be
          # installed and called by its version -- and it does not look in the
          # macOS SDK on its own, which is where arpa/inet.h lives.
          brew install gcc
          newest=$(printf '%s\n' /opt/homebrew/bin/gcc-[0-9]* | sort -V | tail -1)
          cc="$newest -isysroot $(xcrun --show-sdk-path)"
        fi
        if [ "$VENDOR" = clang ] && [ "$(uname)" = Linux ]; then
          # the Makefile's -march=native, on a runner whose CPU reports
          # avx10.1-256, has clang warn that the feature set is invalid -- a
          # verdict on the runner, not the sources, which -Werror would make
          # the build's.
          cc="$cc -Wno-invalid-feature-combination"
        fi
        printf 'CC_ARGS=%s\n' "$cc" >>"$GITHUB_ENV"
    - name: Compiler version
      run: |
        set -euo pipefail
        ${CC_ARGS%% *} --version 2>&1
    # the Makefile already carries -Wall -Wextra -Wsign-conversion -pedantic,
    # so -Werror goes on the compiler rather than into CFLAGS, which would
    # mean repeating that whole line here and letting the two drift apart.
    - name: Build with a warning as an error
      run: |
        set -euo pipefail
        make CC="$CC_ARGS -Werror" 2>&1
